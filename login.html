<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编辑器登录 | 韶华设计</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Noto Sans SC', -apple-system, sans-serif;
      background: #000;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .login-container {
      background: #0a0a0a;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 48px;
      width: 100%;
      max-width: 400px;
    }
    
    .login-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    
    .login-subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 32px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-label {
      display: block;
      font-size: 13px;
      color: #999;
      margin-bottom: 8px;
    }
    
    .form-input {
      width: 100%;
      padding: 12px 16px;
      background: #111;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    
    .form-input:focus {
      border-color: rgba(255,255,255,0.3);
    }
    
    .form-input::placeholder {
      color: #444;
    }
    
    .login-btn {
      width: 100%;
      padding: 14px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 8px;
    }
    
    .login-btn:hover {
      opacity: 0.9;
    }
    
    .login-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .error-msg {
      color: #ff4444;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }
    
    .error-msg.show {
      display: block;
    }
    
    .help-text {
      font-size: 12px;
      color: #555;
      margin-top: 24px;
      line-height: 1.6;
    }
    
    .help-text a {
      color: #888;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1 class="login-title">编辑器登录</h1>
    <p class="login-subtitle">请输入账号密码以进入编辑模式</p>
    
    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">GitHub 用户名</label>
        <input type="text" class="form-input" id="githubUser" placeholder="your-username" required>
      </div>
      
      <div class="form-group">
        <label class="form-label">仓库名称</label>
        <input type="text" class="form-input" id="githubRepo" placeholder="your-repo-name" required>
      </div>
      
      <div class="form-group">
        <label class="form-label">Personal Access Token</label>
        <input type="password" class="form-input" id="githubToken" placeholder="ghp_xxxxxxxxxxxx" required>
      </div>
      
      <div class="form-group">
        <label class="form-label">编辑密码</label>
        <input type="password" class="form-input" id="editorPassword" placeholder="输入编辑密码" required>
      </div>
      
      <button type="submit" class="login-btn" id="loginBtn">进入编辑器</button>
      
      <p class="error-msg" id="errorMsg"></p>
    </form>
    
    <p class="help-text">
      需要一个具有 <code>repo</code> 权限的 GitHub Personal Access Token。<br>
      <a href="https://github.com/settings/tokens/new" target="_blank">创建 Token →</a>
    </p>
  </div>

  <script>
    // 编辑密码（可修改为你想要的密码）
    const EDITOR_PASSWORD = 'shaohua2024';
    
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const user = document.getElementById('githubUser').value.trim();
      const repo = document.getElementById('githubRepo').value.trim();
      const token = document.getElementById('githubToken').value.trim();
      const password = document.getElementById('editorPassword').value;
      
      const errorMsg = document.getElementById('errorMsg');
      const loginBtn = document.getElementById('loginBtn');
      
      errorMsg.classList.remove('show');
      
      // 验证编辑密码
      if (password !== EDITOR_PASSWORD) {
        errorMsg.textContent = '编辑密码错误';
        errorMsg.classList.add('show');
        return;
      }
      
      // 验证 GitHub Token
      loginBtn.disabled = true;
      loginBtn.textContent = '验证中...';
      
      try {
        const response = await fetch('https://api.github.com/user', {
          headers: { Authorization: `token ${token}` }
        });
        
        if (!response.ok) {
          throw new Error('Token 无效');
        }
        
        const userData = await response.json();
        if (userData.login.toLowerCase() !== user.toLowerCase()) {
          throw new Error('用户名与 Token 不匹配');
        }
        
        // 验证仓库是否存在
        const repoResponse = await fetch(`https://api.github.com/repos/${user}/${repo}`, {
          headers: { Authorization: `token ${token}` }
        });
        
        if (!repoResponse.ok) {
          throw new Error('仓库不存在或无权访问');
        }
        
        // 验证成功，保存凭据并跳转到编辑器
        sessionStorage.setItem('github_user', user);
        sessionStorage.setItem('github_repo', repo);
        sessionStorage.setItem('github_token', token);
        sessionStorage.setItem('editor_auth', 'true');
        
        window.location.href = 'editor.html';
        
      } catch (err) {
        errorMsg.textContent = err.message || '验证失败';
        errorMsg.classList.add('show');
        loginBtn.disabled = false;
        loginBtn.textContent = '进入编辑器';
      }
    });
  </script>
</body>
</html>
